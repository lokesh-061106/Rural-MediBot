version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medibot_db
    restart: always
    environment:
      POSTGRES_USER: medibot_user
      POSTGRES_PASSWORD: medibot_pass
      POSTGRES_DB: medibot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibot_user -d medibot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medibot_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medibot_user:medibot_pass@db:5432/medibot_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medibot_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - FASTAPI_BACKEND_URL=http://backend:8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
