services:
  - type: web
    name: medibot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./medibot.db # Note: ephemeral without disk
      - key: CORS_ALLOWED_ORIGINS
        value: "https://medibot.vercel.app" # User needs to update this
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
