name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run backend tests
      env:
        TESTING: "true"
        JWT_SECRET_KEY: "test_secret_key_that_is_at_least_thirty_two_chars_long"
        GROQ_API_KEY: "mock_api_key_for_testing"
      run: |
        cd backend
        pytest -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20"
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    - name: Run frontend build
      run: |
        cd frontend
        npm run build

